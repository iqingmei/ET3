<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六单元环形交互</title>
  <style>
    :root {
      --ring-diameter: 536px;
      --radius: 268px;
      --unit-size: 80px;
      --c1-size: 40px;
      --hole-size: 20px;
      --c2-size: 40px; /* 初始尺寸固定为40px */
      --c2-target-size: 8px; /* 固定的目标尺寸 */
      --offset-angle: 0deg;
    }

    html, body {
      height: 100%; margin: 0; background: #000; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .ring {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: var(--ring-diameter); height: var(--ring-diameter);
    }

    /* 每个轨道项以中心为原点，通过旋转+平移布置到圆周上 */
    .orbit-item {
      position: absolute; left: 50%; top: 50%;
      width: var(--unit-size); height: var(--unit-size);
      transform: rotate(calc(var(--angle) + var(--offset-angle))) translate(var(--radius)) rotate(calc((var(--angle) + var(--offset-angle)) * -1));
      transform-origin: center center;
    }

    /* 热区为160x160，居中承载圆1/圆2 */
    .heat {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: var(--unit-size); height: var(--unit-size);
    }

    /* 圆1：40x40，中心挖孔16x16 */
    .circle1 {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: var(--c1-size); height: var(--c1-size);
      border-radius: 50%;
      background: radial-gradient(circle at center,
        transparent 0 calc(var(--hole-size) / 2),
        var(--c1-grad-start, var(--c1-color, #965E00)) calc(var(--hole-size) / 2),
        var(--c1-grad-end, var(--c1-color, #965E00)) calc(var(--c1-size) / 2)
      );
    }

    /* 圆2：叠在圆1之上，初始为40x40（可通过slider调整） */
    .circle2 {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: var(--c2-size); height: var(--c2-size);
      border-radius: 50%; background: var(--c2-color, #FFB149);
    }

    /* 已取消底部控制条（slider） */

    /* 方案3的圆圈5 */
    .circle5 {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background: #965E00;
      transform: translate(-50%, -50%);
      display: none; /* 默认仅在方案3显示 */
    }

    /* 顶部左侧标签 */
    .tabs { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
    .tabs .tab {
      background: rgba(255,255,255,0.06);
      color: #fff; border: 1px solid rgba(255,255,255,0.24);
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      user-select: none; backdrop-filter: blur(3px);
    }
    .tabs .tab.active { background: #fff; color: #000; border-color: #fff; }
    /* 方案4：隐藏圆1，仅展示圆2（无挖孔） */
    .scheme4 .circle1 { display: none; }
    .scheme5-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .scheme6-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .scheme7-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .scheme8-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .scheme9-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .scheme10-overlay { position: absolute; left: 0; top: 0; width: var(--ring-diameter); height: var(--ring-diameter); pointer-events: none; }
    .controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.24); color: #fff; padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(3px); }
    .controls label { display: inline-flex; align-items: center; gap: 8px; }
    .calib-wrap { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: auto; }
    .scheme5-overlay * { pointer-events: none; }
    .scheme6-overlay * { pointer-events: none; }
    .scheme7-overlay * { pointer-events: none; }
    .scheme8-overlay * { pointer-events: none; }
    .scheme9-overlay * { pointer-events: none; }
    .scheme10-overlay * { pointer-events: none; }
  </style>
</head>
<body>
  <div class="tabs" role="tablist" aria-label="方案切换">
    <button class="tab active" role="tab" aria-selected="true" data-scheme="s1">方案1</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s2">方案2</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s3">方案3</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s4">方案4</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s5">方案5</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s6">方案6</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s7">方案7</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s8">方案8</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s9">方案9</button>
    <button class="tab" role="tab" aria-selected="false" data-scheme="s10">方案10</button>
  </div>
  
  <div class="ring" id="ring">
    <!-- 6个等分：0°, 60°, 120°, 180°, 240°, 300° -->
    <div class="orbit-item" style="--angle: 0deg;" data-angle="0">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
    <div class="orbit-item" style="--angle: 60deg;" data-angle="60">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
    <div class="orbit-item" style="--angle: 120deg;" data-angle="120">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
    <div class="orbit-item" style="--angle: 180deg;" data-angle="180">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
    <div class="orbit-item" style="--angle: 240deg;" data-angle="240">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
    <div class="orbit-item" style="--angle: 300deg;" data-angle="300">
      <div class="heat">
        <div class="circle1"></div>
        <div class="circle2"></div>
        <div class="circle5"></div>
      </div>
    </div>
  </div>

  <script>
    // 固定参数：目标尺寸8px，T1=250ms，T2=400ms
    const T1_MS = 250;
    const T2_MS = 400;

    // 交互：在热区 hover 时触发动画序列
    const units = Array.from(document.querySelectorAll('.orbit-item .heat'));
    units.forEach((heat) => {
      let animating = false;
      heat.addEventListener('mouseenter', () => {
        if (animating) return;
        animating = true;

        const c1 = heat.querySelector('.circle1');
        const c2 = heat.querySelector('.circle2');

        // Step1: 圆2尺寸从当前(--c2-size)缩小到目标尺寸(--c2-target-size)，时长T1=250ms，曲线Quadratic Out
        const t1 = T1_MS;
        const t2 = T2_MS;

        // 先清理可能的过渡
        if (c1) c1.style.transition = 'none';
        c2.style.transition = 'none';

        // 设置起始尺寸（确保与CSS变量一致）
        c2.style.width = getComputedStyle(document.documentElement).getPropertyValue('--c2-size').trim();
        c2.style.height = getComputedStyle(document.documentElement).getPropertyValue('--c2-size').trim();

        // 触发到目标尺寸的过渡
        requestAnimationFrame(() => {
          const target = getComputedStyle(document.documentElement).getPropertyValue('--c2-target-size').trim();
          const easing = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'; // Quadratic Out
          c2.style.transition = `width ${t1}ms ${easing}, height ${t1}ms ${easing}`;
          c2.style.width = target;
          c2.style.height = target;
        });

        // Step2: hold T2 毫秒
        setTimeout(() => {
          // Step3: 圆1与圆2同时缩小到0，时长150ms
          const tShrink = 150;
          if (c1) c1.style.transition = `width ${tShrink}ms linear, height ${tShrink}ms linear`;
          c2.style.transition = `width ${tShrink}ms linear, height ${tShrink}ms linear`;
          if (c1) { c1.style.width = '0px'; c1.style.height = '0px'; }
          c2.style.width = '0px';
          c2.style.height = '0px';

          setTimeout(() => { animating = false; }, tShrink);
        }, t1 + t2);
      });
    });

    // 方案切换：方案1/方案2/方案3/方案4/方案5
    const tabs = Array.from(document.querySelectorAll('.tabs .tab'));
    const setScheme = (scheme) => {
      // 清理样式控制
      document.body.classList.remove('scheme3');
      document.body.classList.remove('scheme4');
      document.body.classList.remove('scheme5');
      document.querySelectorAll('.orbit-item').forEach(oi => oi.style.display = '');
      const ringEl = document.getElementById('ring');
      const s5Overlay = ringEl.querySelector('.scheme5-overlay');
      if (s5Overlay) s5Overlay.remove();
      const s6Overlay = ringEl.querySelector('.scheme6-overlay');
      if (s6Overlay) s6Overlay.remove();
      const s7Overlay = ringEl.querySelector('.scheme7-overlay');
      if (s7Overlay) s7Overlay.remove();
      const s8Overlay = ringEl.querySelector('.scheme8-overlay');
      if (s8Overlay) s8Overlay.remove();
      const s9Overlay = ringEl.querySelector('.scheme9-overlay');
      if (s9Overlay) s9Overlay.remove();
      if (scheme === 's1') {
        // 交换内容：方案1采用原方案2的设置（无孔，目标16px）
        document.documentElement.style.setProperty('--hole-size', '0px');
        document.documentElement.style.setProperty('--c2-target-size', '16px');
        document.documentElement.style.setProperty('--offset-angle', '270deg');
        const items = Array.from(document.querySelectorAll('.orbit-item'));
        const colors = [
          { c1: '#965E00', c2: '#FFB149' },
          { c1: '#796B00', c2: '#FCE33C' },
          { c1: '#537426', c2: '#ABF83E' },
          { c1: '#317840', c2: '#6CFE8B' },
          { c1: '#00795B', c2: '#3DFFC5' },
          { c1: '#00777A', c2: '#00EEF5' },
        ];
        items.forEach((oi, idx) => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          const c2 = heat.querySelector('.circle2');
          const pair = colors[idx % colors.length];
          if (c1) c1.style.setProperty('--c1-color', pair.c1);
          if (c2) c2.style.setProperty('--c2-color', pair.c2);
        });
      } else if (scheme === 's2') {
        document.documentElement.style.setProperty('--hole-size', '0px');
        document.documentElement.style.setProperty('--c2-target-size', '16px');
        document.documentElement.style.setProperty('--offset-angle', '270deg');
        const items = Array.from(document.querySelectorAll('.orbit-item'));
        const topColors = [
          '#FFB149', '#FCE33C', '#ABF83E', '#6CFE8B', '#3DFFC5', '#00EEF5'
        ];
        const gradients = [
          { start: '#523300', end: '#965E00' },
          { start: '#3D3600', end: '#796B00' },
          { start: '#283812', end: '#537426' },
          { start: '#193D21', end: '#317840' },
          { start: '#003D2E', end: '#00795B' },
          { start: '#003C3D', end: '#00777A' },
        ];
        items.forEach((oi, idx) => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          const c2 = heat.querySelector('.circle2');
          const g = gradients[idx % gradients.length];
          if (c1) {
            c1.style.setProperty('--c1-grad-start', g.start);
            c1.style.setProperty('--c1-grad-end', g.end);
          }
          if (c2) c2.style.setProperty('--c2-color', topColors[idx % topColors.length]);
        });
      } else if (scheme === 's3') {
        document.documentElement.style.setProperty('--hole-size', '36px');
        document.documentElement.style.setProperty('--c2-target-size', '12px');
        document.documentElement.style.setProperty('--offset-angle', '270deg');
        document.querySelectorAll('.orbit-item').forEach(oi => oi.style.display = '');
        const items = Array.from(document.querySelectorAll('.orbit-item'));
        const colors = [
          { c1: '#533200', c2: '#FFB149' },
          { c1: '#423900', c2: '#FCE33C' },
          { c1: '#2A3F0F', c2: '#ABF83E' },
          { c1: '#194121', c2: '#6CFE8B' },
          { c1: '#084231', c2: '#3DFFC5' },
          { c1: '#004042', c2: '#00EEF5' },
        ];
        items.forEach((oi, idx) => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          const c2 = heat.querySelector('.circle2');
          const pair = colors[idx % colors.length];
          if (c1) c1.style.setProperty('--c1-color', pair.c1);
          if (c2) c2.style.setProperty('--c2-color', pair.c2);
        });
        document.querySelectorAll('.orbit-item').forEach(oi => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          if (c1) {
            c1.style.removeProperty('--c1-grad-start');
            c1.style.removeProperty('--c1-grad-end');
          }
        });
      } else if (scheme === 's4') {
        document.body.classList.add('scheme4');
        document.documentElement.style.setProperty('--hole-size', '0px');
        document.documentElement.style.setProperty('--c2-target-size', '12px');
        document.documentElement.style.setProperty('--offset-angle', '270deg');
        document.querySelectorAll('.orbit-item').forEach(oi => oi.style.display = '');
        const items = Array.from(document.querySelectorAll('.orbit-item'));
        const colors = [
          { c1: '#965E00', c2: '#FFB149' },
          { c1: '#796B00', c2: '#FCE33C' },
          { c1: '#537426', c2: '#ABF83E' },
          { c1: '#317840', c2: '#6CFE8B' },
          { c1: '#00795B', c2: '#3DFFC5' },
          { c1: '#00777A', c2: '#00EEF5' },
        ];
        items.forEach((oi, idx) => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          const c2 = heat.querySelector('.circle2');
          const pair = colors[idx % colors.length];
          if (c1) c1.style.setProperty('--c1-color', pair.c1);
          if (c2) c2.style.setProperty('--c2-color', pair.c2);
        });
        document.querySelectorAll('.orbit-item').forEach(oi => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          if (c1) {
            c1.style.removeProperty('--c1-grad-start');
            c1.style.removeProperty('--c1-grad-end');
          }
        });
      } else if (scheme === 's5') {
        const tabsEl = document.querySelector('.tabs');
        if (tabsEl) tabsEl.style.display = '';
        document.querySelectorAll('.orbit-item').forEach(oi => oi.style.display = 'none');
        const ring = document.getElementById('ring');
        let overlay = ring.querySelector('.scheme5-overlay');
        if (!overlay) {
          overlay = document.createElementNS('http://www.w3.org/2000/svg','svg');
          overlay.classList.add('scheme5-overlay');
          const sizeStr = getComputedStyle(document.documentElement).getPropertyValue('--ring-diameter').trim();
          overlay.setAttribute('width', sizeStr);
          overlay.setAttribute('height', sizeStr);
          const d = parseFloat(sizeStr);
          overlay.setAttribute('viewBox', `0 0 ${d} ${d}`);
          overlay.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          overlay.setAttribute('style', 'overflow:visible');
          ring.appendChild(overlay);
        }
        while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
        const sizeStr = getComputedStyle(document.documentElement).getPropertyValue('--ring-diameter').trim();
        const d = parseFloat(sizeStr);
        const cx = d / 2; const cy = d / 2;
        const t0 = 4; const t1 = 12; const spanDeg = 60; const n = 96;
        const r0 = d / 2 - t1 / 2;
        document.documentElement.style.setProperty('--radius', `${r0}px`);
        document.documentElement.style.setProperty('--offset-angle', '270deg');
        document.documentElement.style.setProperty('--hole-size', '0px');
        document.documentElement.style.setProperty('--c2-target-size', '16px');
        const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
        overlay.appendChild(defs);
        let rotateGroup = overlay.querySelector('#s5-rotate-group');
        if (!rotateGroup) {
          rotateGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
          rotateGroup.setAttribute('id', 's5-rotate-group');
          overlay.appendChild(rotateGroup);
        }
        function pt(a, rr) { return { x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a) }; }
        const items = Array.from(document.querySelectorAll('.orbit-item'));
        const s1Pairs = [
          { c1: '#965E00', c2: '#FFB149' },
          { c1: '#796B00', c2: '#FCE33C' },
          { c1: '#537426', c2: '#ABF83E' },
          { c1: '#317840', c2: '#6CFE8B' },
          { c1: '#00795B', c2: '#3DFFC5' },
          { c1: '#00777A', c2: '#00EEF5' },
        ];
        items.forEach((oi, idx) => {
          const heat = oi.querySelector('.heat');
          const c1 = heat.querySelector('.circle1');
          const c2 = heat.querySelector('.circle2');
          const pair = s1Pairs[idx % s1Pairs.length];
          if (c1) {
            c1.style.setProperty('--c1-color', pair.c1);
            c1.style.removeProperty('--c1-grad-start');
            c1.style.removeProperty('--c1-grad-end');
          }
          if (c2) c2.style.setProperty('--c2-color', pair.c2);
        });
        for (let i = 0; i < 6; i++) {
          const startDeg = -90 + i * 60; const endDeg = startDeg + spanDeg;
          const startRad = startDeg * Math.PI / 180; const endRad = endDeg * Math.PI / 180;
          const lg = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
          const gid = `s5g-${i}`; lg.setAttribute('id', gid); lg.setAttribute('gradientUnits','userSpaceOnUse');
          const sPt = pt(startRad, r0); const ePt = pt(endRad, r0);
          lg.setAttribute('x1', sPt.x); lg.setAttribute('y1', sPt.y);
          lg.setAttribute('x2', ePt.x); lg.setAttribute('y2', ePt.y);
          const palette = i === 1
            ? ['#FCE33C','#D3ED3D','#BFF33E','#ABF83E']
            : (i === 2
              ? ['#ABF83E','#8BFB65','#7CFD78','#6CFE8B']
              : (i === 3
                ? ['#6CFE8B','#55FFA8','#49FFB7','#3DFFC5']
                : (i === 4
                  ? ['#3DFFC5','#1FF7DD','#0FF2E9','#00EEF5']
                  : (i === 5
                    ? ['#00EEF5','#80CF9F','#BFC074','#FFB149']
                    : ['#FFB149','#FECA43','#FDD63F','#FCE33C']))));
          const s0 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s0.setAttribute('offset','0%'); s0.setAttribute('stop-color',palette[0]); s0.setAttribute('stop-opacity','0');
          const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s1.setAttribute('offset','50%'); s1.setAttribute('stop-color',palette[1]); s1.setAttribute('stop-opacity','0.08');
          const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s2.setAttribute('offset','80%'); s2.setAttribute('stop-color',palette[2]); s2.setAttribute('stop-opacity','0.32');
          const s3 = document.createElementNS('http://www.w3.org/2000/svg','stop'); s3.setAttribute('offset','100%'); s3.setAttribute('stop-color',palette[3]); s3.setAttribute('stop-opacity','0.8');
          lg.appendChild(s0); lg.appendChild(s1); lg.appendChild(s2); lg.appendChild(s3); defs.appendChild(lg);
          let pathD = '';
          for (let j = 0; j <= n; j++) {
            const t = j / n; const a = startRad + (endRad - startRad) * t; const th = t0 + (t1 - t0) * t;
            const p = pt(a, r0 + th / 2);
            if (j === 0) pathD += `M ${p.x} ${p.y}`; else pathD += ` L ${p.x} ${p.y}`;
          }
          const endTh = t1; const endInner = pt(endRad, r0 - endTh / 2);
          pathD += ` A ${endTh/2} ${endTh/2} 0 0 1 ${endInner.x} ${endInner.y}`;
          for (let j = n; j >= 0; j--) {
            const t = j / n; const a = startRad + (endRad - startRad) * t; const th = t0 + (t1 - t0) * t;
            const p = pt(a, r0 - th / 2);
            pathD += ` L ${p.x} ${p.y}`;
          }
          const startTh = t0; const startOuter = pt(startRad, r0 + startTh / 2);
          pathD += ` A ${startTh/2} ${startTh/2} 0 0 1 ${startOuter.x} ${startOuter.y}`;
          pathD += ' Z';
          const path = document.createElementNS('http://www.w3.org/2000/svg','path');
          path.setAttribute('id', `s5-path-${i}`);
          path.setAttribute('d', pathD);
          path.setAttribute('fill', `url(#${gid})`);
          path.setAttribute('stroke', 'none');
          path.style.display = 'none';
          rotateGroup.appendChild(path);
        }
        const startDeg0 = -90; const endDeg0 = startDeg0 + spanDeg;
        const startRad0 = startDeg0 * Math.PI / 180; const endRad0 = endDeg0 * Math.PI / 180;
        const startPt0 = pt(startRad0, r0); const endPt0 = pt(endRad0, r0);
        let centerPath0 = document.createElementNS('http://www.w3.org/2000/svg','path');
        centerPath0.setAttribute('id', 's5-center-0');

        calibHeat.style.opacity = '1';
        calibWrap.appendChild(calibHeat);
        const calibC1 = document.createElement('div');
        calibC1.className = 'circle1';
        calibC1.style.setProperty('--c1-size', '40px');
        calibC1.style.background = '#965E00';
        const calibC2 = document.createElement('div');
        calibC2.className = 'circle2';
        calibC2.style.setProperty('--c2-size', '40px');
        calibC2.style.setProperty('--c2-color', '#FFB149');
        calibHeat.appendChild(calibC1);
        calibHeat.appendChild(calibC2);
        calibWrap.style.transform = `translate(${startPt0.x}px, ${startPt0.y}px)`;
        function revealSegment(i) {
          const mp = defs.querySelector(`#s10-mask-${i}`);
          const center = overlay.querySelector(`#s10-center-${i}`);
          const L = center.getTotalLength();
          const tMove = 350;
          const easing = (t) => t * t;
          const t0ts = performance.now();
          const sd = -90 + i * 60; const ed = sd + spanDeg;
          const sr = sd * Math.PI / 180; const er = ed * Math.PI / 180;
          const grad = defs.querySelector(`#s10g-${i}`);
          const segGroup = overlay.querySelector(`#s10-dots-${i}`);
          segGroup.style.display = 'block';
          function step(ts) {
            const p = Math.min(1, (ts - t0ts) / tMove);
            const e = easing(p);
            const len = L * e;
            mp.setAttribute('stroke-dasharray', `${len} ${L - len}`);
            const endRad = sr + (er - sr) * e;
            const sPt = pt(sr, r0); const ePt = pt(endRad, r0);
            if (grad) { grad.setAttribute('x1', sPt.x); grad.setAttribute('y1', sPt.y); grad.setAttribute('x2', ePt.x); grad.setAttribute('y2', ePt.y); }
            if (p < 1) requestAnimationFrame(step); else {
              const capGroup = overlay.querySelector(`#s10-cap-${i}`);
              if (capGroup) capGroup.style.display = 'block';
              if (i < 5) {
                const endDeg = -90 + i * 60 + spanDeg;
                const endRad2 = endDeg * Math.PI / 180;
                const endPt = pt(endRad2, r0);
                const endWrap = document.createElement('div');
                endWrap.className = 'calib-wrap';
                ring.appendChild(endWrap);
                const endHeat = document.createElement('div');
                endHeat.className = 'heat';
                endWrap.appendChild(endHeat);
                const endC1 = document.createElement('div');
                endC1.className = 'circle1';
                endC1.style.setProperty('--c1-size', '0px');
                endC1.style.background = '#796B00';
                const endC2 = document.createElement('div');
                endC2.className = 'circle2';
                endC2.style.setProperty('--c2-size', '0px');
                endC2.style.setProperty('--c2-color', '#FCE33C');
                endHeat.appendChild(endC1); endHeat.appendChild(endC2);
                endWrap.style.transform = `translate(${endPt.x}px, ${endPt.y}px)`;
                requestAnimationFrame(() => {
                  endC1.style.transition = 'width 150ms ease-out, height 150ms ease-out';
                  endC2.style.transition = 'width 150ms ease-out, height 150ms ease-out';
                  endC1.style.setProperty('--c1-size', '40px');
                  endC2.style.setProperty('--c2-size', '40px');
                });
                let endState = 'idle';
                let endHoldTimer = null;
                let toEndAnim2Timer = null;
                endHeat.addEventListener('mouseenter', () => {
                  if (endState !== 'idle') return;
                  endState = 'anim1';
                  endC2.style.transition = 'width 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94), height 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                  endC2.style.setProperty('--c2-size', '16px');
                  const onEnd2 = () => {
                    if (endState !== 'anim1') return;
                    endState = 'hold';
                    endHoldTimer = setTimeout(() => {
                      endState = 'anim2';
                      endC2.style.transition = 'width 150ms ease-out, height 150ms ease-out';
                      endC2.style.setProperty('--c2-size', '0px');
                      endC1.style.transition = 'width 150ms ease-out, height 150ms ease-out';
                      endC1.style.setProperty('--c1-size', '0px');
                      endHeat.style.transition = 'opacity 150ms ease-out';
                      endHeat.style.opacity = '0';
                      toEndAnim2Timer = setTimeout(() => {
                        const j = i + 1;
                        if (j < 6) {
                          revealSegment(j);
                        } else {
                          setTimeout(() => { animateRotation(); }, 250);
                        }
                      }, 150);
                    }, 400);
                  };
                  endC2.addEventListener('transitionend', onEnd2, { once: true });
                });
                endHeat.addEventListener('mouseleave', () => {
                  if (endState === 'anim1' || endState === 'hold') {
                    if (endHoldTimer) { clearTimeout(endHoldTimer); endHoldTimer = null; }
                    if (toEndAnim2Timer) { clearTimeout(toEndAnim2Timer); toEndAnim2Timer = null; }
                    endState = 'idle';
                    endHeat.style.opacity = '1';
                    endC2.style.transition = 'width 250ms ease-in, height 250ms ease-in';
                    endC2.style.setProperty('--c2-size', '40px');
                    endC1.style.setProperty('--c1-size', '40px');
                  }
                });
              } else {
                setTimeout(() => { animateRotation(); }, 250);
              }
            }
          }
          requestAnimationFrame(step);
        }
        calibHeat.addEventListener('mouseenter', () => {
          if (state !== 'idle') return;
          state = 'anim1';
          calibC2.style.transition = 'width 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94), height 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          calibC2.style.width = '16px';
          calibC2.style.height = '16px';
          const onEnd = () => {
            if (state !== 'anim1') return;
            state = 'hold';
            holdTimer = setTimeout(() => {
              state = 'anim2';
              calibC2.style.transition = 'width 150ms ease-out, height 150ms ease-out';
              calibC2.style.width = '0px';
              calibC2.style.height = '0px';
              calibC1.style.transition = 'width 150ms ease-out, height 150ms ease-out';
              calibC1.style.width = '0px';
              calibC1.style.height = '0px';
              calibHeat.style.transition = 'opacity 150ms ease-out';
              calibHeat.style.opacity = '0';
              toAnim2Timer = setTimeout(() => { revealSegment(0); }, 150);
            }, 400);
          };
          calibC2.addEventListener('transitionend', onEnd, { once: true });
        });
        calibHeat.addEventListener('mouseleave', () => {
          if (state === 'anim1' || state === 'hold') {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            if (toAnim2Timer) { clearTimeout(toAnim2Timer); toAnim2Timer = null; }
            state = 'idle';
            calibHeat.style.opacity = '1';
            calibC2.style.transition = 'width 250ms ease-in, height 250ms ease-in';
            calibC2.style.width = '40px';
            calibC2.style.height = '40px';
          }
        });
      }
    };
    // 方案3交互：圆5从40缩至16（#965E00->#FF9200），随后溶球挤压并迅速移动到右上角，收至8再扩散到40并复色
    
    // 初始化：从 localStorage 读取方案并应用，同时更新标签态
    const savedScheme = localStorage.getItem('scheme') || 's1';
    setScheme(savedScheme);
    tabs.forEach(t => {
      t.classList.toggle('active', t.dataset.scheme === savedScheme);
      t.setAttribute('aria-selected', t.dataset.scheme === savedScheme ? 'true' : 'false');
    });
    // 点击切换：保存方案并刷新页面
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        localStorage.setItem('scheme', tab.dataset.scheme);
        location.reload();
      });
    });
  </script>
</body>
</html>
